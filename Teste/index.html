<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotsites 2027</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090b10;
      color: #f7f7f8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 93, 43, .22), transparent 34%),
        radial-gradient(circle at 85% 85%, rgba(190, 63, 255, .18), transparent 36%),
        #090b10;
    }

    main { width: min(960px, 100%); }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 6vw, 4rem);
      letter-spacing: -.05em;
    }

    p { margin: 0 0 28px; color: #b7bac4; }

    nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    a {
      min-height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: end;
      gap: 8px;
      padding: 24px;
      color: inherit;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      background: rgba(255,255,255,.06);
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }

    a:hover, a:focus-visible {
      transform: translateY(-4px);
      border-color: rgba(255,255,255,.36);
      background: rgba(255,255,255,.1);
    }

    strong { font-size: 1.2rem; }
    span { color: #b7bac4; font-size: .92rem; }
  </style>
</head>
<body>
  <main>
    <h1>Hotsites 2027</h1>
    <p>Escolha uma experiência para visualizar.</p>
    <nav aria-label="Hotsites disponíveis">
      <a href="/estaçoes/primavera/combo-circuito-estacoes-2027.html">
        <strong>Combo Circuito das Estações</strong>
        <span>Primavera 2027</span>
      </a>
      <a href="/estaçoes/outono/HotsiteOutono.html">
        <strong>Circuito das Estações</strong>
        <span>Outono 2027</span>
      </a>
      <a href="/estaçoes/girl-power/girl-power-run.html">
        <strong>Girl Power Run</strong>
        <span>Feita para se mover</span>
      </a>
    </nav>
  </main>
</body>
</html>
